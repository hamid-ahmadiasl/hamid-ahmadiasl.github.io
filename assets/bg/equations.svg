<text x="54.0" y="70.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="36" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">ρ(∂u/∂t + u·∇u) = −∇p + μ∇²u + f</text>
<text x="54.0" y="135.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="36" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">∇·u = 0</text>
<text x="54.0" y="230.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="34" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">ℒ(θ) = (1/N) Σ ‖ yᵢ − f(xᵢ; θ) ‖²</text>
<text x="54.0" y="290.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="34" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">θ ← θ − η ∇θ ℒ(θ)</text>
<text x="54.0" y="385.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="34" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">Re = ρUL / μ</text>
<text x="420.0" y="385.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="34" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">C_p = (p − p∞) / (½ρU²)</text>
<text x="54.0" y="445.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="32" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">p + ½ρu² + ρgz = const</text>
<text x="54.0" y="540.0" font-family="'Cambria Math','STIX Two Math','DejaVu Serif',Georgia,serif" font-size="34" stroke="none" font-style="italic" fill="#a493ff" fill-opacity="0.95">ŷ = β₀ + Σ βᵢxᵢ + Σ βᵢⱼ xᵢxⱼ</text>
